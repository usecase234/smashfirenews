services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smashfire
      POSTGRES_PASSWORD: smashfire
      POSTGRES_DB: smashfire_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  hub:
    build:
      context: ../hub
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ../hub:/app

  # Optional — only needed once you're testing the plugin locally rather
  # than against a real staging WordPress site.
  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      - mysql
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - "../plugin:/var/www/html/wp-content/plugins/smashfire-pr"

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress

volumes:
  pgdata:
